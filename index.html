<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Particle Playground</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
      overscroll-behavior: none;
      touch-action: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
  </style>
</head>
<body>
<canvas id="playground" aria-label="Interactive colored particle playground"></canvas>
<script>
(() => {
  const canvas = document.getElementById('playground');
  const ctx = canvas.getContext('2d', { alpha: false });
  const colors = [
    '#ff3864', '#ff8a35', '#ffd447', '#a7ff4f',
    '#38f5bd', '#35d9ff', '#5487ff', '#a879ff',
    '#f45cff', '#ff77bd'
  ];

  let width = 0, height = 0, dpr = 1;
  let particles = [];
  const pointer = { x: -1000, y: -1000, px: -1000, py: -1000, down: false, active: false };
  const random = (min, max) => min + Math.random() * (max - min);

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const count = Math.min(650, Math.max(180, Math.floor(width * height / 1500)));
    particles = Array.from({ length: count }, () => ({
      x: random(0, width), y: random(0, height),
      vx: random(-0.55, 0.55), vy: random(-0.55, 0.55),
      radius: random(1.4, 3.8),
      color: colors[Math.floor(Math.random() * colors.length)],
      phase: random(0, Math.PI * 2)
    }));
  }

  function movePointer(event) {
    const rect = canvas.getBoundingClientRect();
    pointer.px = pointer.x;
    pointer.py = pointer.y;
    pointer.x = event.clientX - rect.left;
    pointer.y = event.clientY - rect.top;
    pointer.active = true;
  }

  canvas.addEventListener('pointerdown', event => {
    movePointer(event);
    pointer.down = true;
    try { canvas.setPointerCapture(event.pointerId); } catch (_) {}
  });
  canvas.addEventListener('pointermove', movePointer);
  function releasePointer() { pointer.down = false; }
  canvas.addEventListener('pointerup', releasePointer);
  canvas.addEventListener('pointercancel', releasePointer);
  canvas.addEventListener('pointerleave', event => {
    if (event.pointerType === 'mouse' && !pointer.down) pointer.active = false;
  });
  window.addEventListener('resize', resize, { passive: true });

  function animate(time) {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.22)';
    ctx.fillRect(0, 0, width, height);

    const influence = pointer.down ? 155 : 105;
    for (const p of particles) {
      p.phase += 0.015;
      p.vx += Math.cos(p.phase) * 0.006;
      p.vy += Math.sin(p.phase * 1.17) * 0.006;

      if (pointer.active) {
        const dx = p.x - pointer.x;
        const dy = p.y - pointer.y;
        const dist2 = dx * dx + dy * dy;
        if (dist2 < influence * influence && dist2 > 0.1) {
          const dist = Math.sqrt(dist2);
          const falloff = 1 - dist / influence;
          const force = (pointer.down ? 1.9 : 0.55) * falloff;
          // A moving finger creates a swirl; holding still gently pushes particles away.
          const swipeX = pointer.x - pointer.px;
          const swipeY = pointer.y - pointer.py;
          p.vx += (dx / dist) * force + (-dy / dist) * Math.min(1.5, Math.abs(swipeX) * 0.025) * falloff;
          p.vy += (dy / dist) * force + (dx / dist) * Math.min(1.5, Math.abs(swipeY) * 0.025) * falloff;
          if (pointer.down) {
            p.vx += swipeX * 0.018 * falloff;
            p.vy += swipeY * 0.018 * falloff;
          }
        }
      }

      p.vx *= 0.986;
      p.vy *= 0.986;
      const maxSpeed = pointer.down ? 12 : 4.2;
      const speed = Math.hypot(p.vx, p.vy);
      if (speed > maxSpeed) {
        p.vx = p.vx / speed * maxSpeed;
        p.vy = p.vy / speed * maxSpeed;
      }
      p.x += p.vx;
      p.y += p.vy;

      // Wrap around the edges.
      if (p.x < -8) p.x = width + 8;
      if (p.x > width + 8) p.x = -8;
      if (p.y < -8) p.y = height + 8;
      if (p.y > height + 8) p.y = -8;

      ctx.globalAlpha = 0.65 + Math.sin(p.phase) * 0.25;
      ctx.fillStyle = p.color;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = p.radius * 3.5;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
    pointer.px = pointer.x;
    pointer.py = pointer.y;
    requestAnimationFrame(animate);
  }

  resize();
  requestAnimationFrame(animate);
})();
</script>
</body>
</html>
